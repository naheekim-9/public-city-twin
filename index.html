<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CITY TWIN">

<title>PUBLIC CITY TWIN</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#07101c;
  color:white;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

#app{
  width:100%;
  height:100%;
  position:relative;
}

canvas{
  display:block;
  width:100%;
  height:100%;
  touch-action:none;
}

#loading{
  position:absolute;
  inset:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#07101c;
  font-size:20px;
  font-weight:700;
}

#panel{
  position:absolute;
  z-index:20;
  left:14px;
  top:14px;
  width:310px;
  max-height:calc(100% - 28px);
  overflow:auto;

  padding:17px;

  background:rgba(7,15,27,.91);
  backdrop-filter:blur(20px);

  border:1px solid rgba(255,255,255,.12);
  border-radius:20px;

  box-shadow:0 20px 60px rgba(0,0,0,.45);
}

h1{
  margin:0;
  font-size:20px;
}

.subtitle{
  margin-top:4px;
  margin-bottom:15px;
  color:#91a4bd;
  font-size:11px;
}

.title{
  margin-top:15px;
  margin-bottom:7px;
  font-size:11px;
  font-weight:700;
  color:#91a9c5;
  letter-spacing:.5px;
}

button{
  border:0;
  color:white;
  background:#182a40;
  border-radius:10px;
  padding:9px 10px;
  margin:2px;
  font-weight:650;
  font-size:11px;
}

button:active{
  transform:scale(.96);
}

button.active{
  background:#397eff;
}

.row{
  display:flex;
  flex-wrap:wrap;
}

.slider{
  margin:10px 0;
}

.sliderTop{
  display:flex;
  justify-content:space-between;
  font-size:11px;
  margin-bottom:5px;
}

.sliderTop span:last-child{
  color:#8eb7ff;
  font-weight:700;
}

input[type=range]{
  width:100%;
  accent-color:#4285ff;
}

.metrics{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-top:12px;
}

.metric{
  background:rgba(255,255,255,.055);
  border:1px solid rgba(255,255,255,.05);
  border-radius:11px;
  padding:9px;
}

.metric small{
  display:block;
  color:#8192a9;
  font-size:9px;
}

.metric b{
  display:block;
  margin-top:2px;
  font-size:16px;
}

#year{
  margin-top:8px;
  color:#75aaff;
  font-size:12px;
  font-weight:700;
}

#info{
  position:absolute;
  z-index:25;
  right:18px;
  top:18px;

  width:235px;
  padding:14px;

  background:rgba(7,15,27,.88);
  backdrop-filter:blur(16px);

  border:1px solid rgba(255,255,255,.12);
  border-radius:15px;

  display:none;
}

#info h2{
  font-size:15px;
  margin:0 0 5px;
}

#info p{
  font-size:11px;
  color:#aab8ca;
  line-height:1.5;
  margin:0;
}

#legend{
  position:absolute;
  right:18px;
  bottom:18px;
  z-index:10;

  background:rgba(7,15,27,.78);
  padding:9px 12px;
  border-radius:12px;

  font-size:10px;
  color:#b9c6d6;
}

#hint{
  position:absolute;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  z-index:10;

  background:rgba(5,12,22,.72);
  padding:8px 13px;
  border-radius:20px;

  font-size:10px;
  color:#c6d1df;
  pointer-events:none;
}

@media(max-width:700px){

  #panel{
    width:275px;
    left:8px;
    top:8px;
    padding:13px;
    max-height:calc(100% - 16px);
  }

  #info{
    right:8px;
    top:8px;
    width:190px;
  }

  #legend{
    display:none;
  }

  #hint{
    bottom:8px;
  }
}
</style>
</head>

<body>

<div id="app">

  <div id="loading">
    🏙️ CITY TWIN 불러오는 중...
  </div>

  <div id="panel">

    <h1>🏙️ PUBLIC CITY TWIN</h1>

    <div class="subtitle">
      2차 공공기관 이전 · 공간 기반 도시 시뮬레이션
    </div>

    <div class="title">도시 모델</div>

    <div class="row">
      <button data-preset="optimal">통합 최적형</button>
      <button data-preset="industry">산업 클러스터</button>
      <button data-preset="living">정주환경 중심</button>
      <button data-preset="talent">지역인재 중심</button>
    </div>

    <div class="title">공간 구조</div>

    <div class="row">
      <button data-layout="compact" class="active">집약형</button>
      <button data-layout="linear">선형형</button>
      <button data-layout="multi">다핵형</button>
    </div>

    <div class="title">정책 변수</div>

    <div class="slider">
      <div class="sliderTop">
        <span>🏠 정주환경</span>
        <span id="vSettlement">85</span>
      </div>
      <input id="settlement" type="range" min="0" max="100" value="85">
    </div>

    <div class="slider">
      <div class="sliderTop">
        <span>🏭 산업 클러스터</span>
        <span id="vIndustry">85</span>
      </div>
      <input id="industry" type="range" min="0" max="100" value="85">
    </div>

    <div class="slider">
      <div class="sliderTop">
        <span>🎓 지역인재</span>
        <span id="vTalent">80</span>
      </div>
      <input id="talent" type="range" min="0" max="100" value="80">
    </div>

    <div class="slider">
      <div class="sliderTop">
        <span>🚉 교통망</span>
        <span id="vTransport">85</span>
      </div>
      <input id="transport" type="range" min="0" max="100" value="85">
    </div>

    <div class="slider">
      <div class="sliderTop">
        <span>🔬 산학연 연계</span>
        <span id="vResearch">85</span>
      </div>
      <input id="research" type="range" min="0" max="100" value="85">
    </div>

    <div class="title">시간 이동</div>

    <div class="row">
      <button id="year1">+1년</button>
      <button id="year5">+5년</button>
      <button id="year20" class="active">+20년</button>
    </div>

    <div id="year">
      현재 시점 : 2026년
    </div>

    <div class="metrics">

      <div class="metric">
        <small>인구</small>
        <b id="population">40,000</b>
      </div>

      <div class="metric">
        <small>입주 기업</small>
        <b id="firms">120</b>
      </div>

      <div class="metric">
        <small>일자리</small>
        <b id="jobs">8,000</b>
      </div>

      <div class="metric">
        <small>상권 활성도</small>
        <b id="commerce">72%</b>
      </div>

      <div class="metric">
        <small>교류 밀도</small>
        <b id="exchange">78%</b>
      </div>

      <div class="metric">
        <small>정착 안정성</small>
        <b id="stability">82%</b>
      </div>

    </div>

  </div>

  <div id="info">
    <h2 id="infoTitle"></h2>
    <p id="infoText"></p>
  </div>

  <div id="legend">
    🔵 공공기관　🟣 대학　🟢 연구소　🟠 기업　⚪ 주거
  </div>

  <div id="hint">
    👆 드래그: 도시 회전 · 두 손가락: 확대/축소 · 건물 터치: 정보
  </div>

</div>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";


/* =========================
   기본 변수
========================= */

let scene;
let camera;
let renderer;

let city = new THREE.Group();

let buildings = [];
let roads = [];
let parks = [];
let trees = [];

let currentYear = 2026;

let layoutType = "compact";

let values = {
  settlement:85,
  industry:85,
  talent:80,
  transport:85,
  research:85
};


/* =========================
   초기화
========================= */

init();


function init(){

  scene = new THREE.Scene();

  scene.background =
    new THREE.Color(0x07101c);


  camera = new THREE.PerspectiveCamera(
    48,
    innerWidth / innerHeight,
    0.1,
    1000
  );

  camera.position.set(
    65,
    58,
    68
  );

  camera.lookAt(0,0,0);


  renderer = new THREE.WebGLRenderer({
    antialias:true,
    powerPreference:"high-performance"
  });

  renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,2)
  );

  renderer.setSize(
    innerWidth,
    innerHeight
  );

  renderer.shadowMap.enabled = true;

  document
    .getElementById("app")
    .appendChild(renderer.domElement);


  /* 조명 */

  const ambient =
    new THREE.HemisphereLight(
      0xcfe1ff,
      0x111927,
      2.2
    );

  scene.add(ambient);


  const sun =
    new THREE.DirectionalLight(
      0xffffff,
      3
    );

  sun.position.set(
    40,
    80,
    30
  );

  sun.castShadow = true;

  scene.add(sun);


  createGround();


  /* ⭐ 기존 버전에서 빠졌던 핵심 */
  scene.add(city);


  createCity("compact");


  setupControls();

  setupButtons();

  setupSliders();

  setupClick();


  animate();


  setTimeout(()=>{
    document.getElementById("loading").style.display="none";
  },700);
}


/* =========================
   바닥
========================= */

function createGround(){

  const geo =
    new THREE.PlaneGeometry(
      180,
      180
    );

  const mat =
    new THREE.MeshStandardMaterial({
      color:0x172333,
      roughness:.95
    });

  const ground =
    new THREE.Mesh(
      geo,
      mat
    );

  ground.rotation.x =
    -Math.PI/2;

  ground.receiveShadow = true;

  scene.add(ground);


  /* 도시 구역 */

  const grid =
    new THREE.GridHelper(
      160,
      32,
      0x2d3e52,
      0x172538
    );

  grid.position.y=.03;

  scene.add(grid);
}


/* =========================
   도로
========================= */

function createRoad(
  x,
  z,
  width,
  depth
){

  const geo =
    new THREE.BoxGeometry(
      width,
      .12,
      depth
    );

  const mat =
    new THREE.MeshStandardMaterial({
      color:0x26384c,
      roughness:1
    });

  const mesh =
    new THREE.Mesh(
      geo,
      mat
    );

  mesh.position.set(
    x,
    .06,
    z
  );

  mesh.receiveShadow=true;

  city.add(mesh);

  roads.push(mesh);
}


/* =========================
   공원
========================= */

function createPark(
  x,
  z,
  w,
  d
){

  const geo =
    new THREE.BoxGeometry(
      w,
      .18,
      d
    );

  const mat =
    new THREE.MeshStandardMaterial({
      color:0x24513f
    });

  const mesh =
    new THREE.Mesh(
      geo,
      mat
    );

  mesh.position.set(
    x,
    .09,
    z
  );

  city.add(mesh);

  parks.push(mesh);


  for(let i=0;i<7;i++){

    createTree(
      x+(Math.random()-.5)*w*.8,
      z+(Math.random()-.5)*d*.8
    );

  }
}


/* =========================
   나무
========================= */

function createTree(x,z){

  const trunk =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        .15,
        .2,
        1.1,
        7
      ),
      new THREE.MeshStandardMaterial({
        color:0x604632
      })
    );

  trunk.position.set(
    x,
    .55,
    z
  );


  const crown =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        .7,
        10,
        8
      ),
      new THREE.MeshStandardMaterial({
        color:0x2e684c
      })
    );

  crown.position.set(
    x,
    1.35,
    z
  );


  city.add(
    trunk,
    crown
  );

  trees.push(
    trunk,
    crown
  );
}


/* =========================
   건물
========================= */

function createBuilding(
  x,
  z,
  w,
  d,
  h,
  type
){

  let color=0x8191a5;

  if(type==="public")
    color=0x397fff;

  if(type==="university")
    color=0x765ee8;

  if(type==="research")
    color=0x31a58e;

  if(type==="company")
    color=0xe18a45;

  if(type==="housing")
    color=0x718096;

  if(type==="commercial")
    color=0xd4a84d;


  const geo =
    new THREE.BoxGeometry(
      w,
      h,
      d
    );


  const mat =
    new THREE.MeshStandardMaterial({
      color:color,
      roughness:.55,
      metalness:.05
    });


  const mesh =
    new THREE.Mesh(
      geo,
      mat
    );


  mesh.position.set(
    x,
    h/2,
    z
  );


  mesh.castShadow=true;
  mesh.receiveShadow=true;


  mesh.userData={
    type:type,
    height:h,
    x:x,
    z:z
  };


  city.add(mesh);

  buildings.push(mesh);


  /* 건물 위 작은 옥상 구조물 */

  if(h>16){

    const roof =
      new THREE.Mesh(
        new THREE.BoxGeometry(
          w*.35,
          1.2,
          d*.35
        ),
        new THREE.MeshStandardMaterial({
          color:0x526276
        })
      );

    roof.position.set(
      x,
      h+.6,
      z
    );

    city.add(roof);

  }
}


/* =========================
   도시 초기화
========================= */

function clearCity(){

  buildings.forEach(
    b=>city.remove(b)
  );

  roads.forEach(
    r=>city.remove(r)
  );

  parks.forEach(
    p=>city.remove(p)
  );

  trees.forEach(
    t=>city.remove(t)
  );

  buildings=[];
  roads=[];
  parks=[];
  trees=[];
}


/* =========================
   도시 생성
========================= */

function createCity(type){

  clearCity();

  layoutType=type;


  /* 중심 간선도로 */

  createRoad(
    0,
    0,
    150,
    2.4
  );

  createRoad(
    0,
    0,
    2.4,
    150
  );


  if(type==="compact"){

    createCompactCity();

  }


  if(type==="linear"){

    createLinearCity();

  }


  if(type==="multi"){

    createMultiCity();

  }


  /* 공원 */

  createPark(
    -28,
    27,
    22,
    17
  );

  createPark(
    29,
    -27,
    20,
    16
  );


  /* 추가 녹지 */

  for(let i=0;i<18;i++){

    createTree(
      (Math.random()-.5)*125,
      (Math.random()-.5)*125
    );

  }

}


/* =========================
   집약형
========================= */

function createCompactCity(){

  /* 공공기관 중심 */

  createBuilding(
    0,
    0,
    14,
    12,
    32,
    "public"
  );


  /* 대학 */

  createBuilding(
    -24,
    -22,
    13,
    10,
    19,
    "university"
  );


  /* 연구소 */

  createBuilding(
    25,
    -21,
    12,
    10,
    23,
    "research"
  );


  /* 기업 클러스터 */

  for(let i=0;i<14;i++){

    const angle =
      i/14*Math.PI*2;

    const radius =
      17 + Math.random()*12;

    createBuilding(
      Math.cos(angle)*radius,
      Math.sin(angle)*radius,
      5+Math.random()*3,
      5+Math.random()*3,
      8+Math.random()*20,
      "company"
    );

  }


  /* 주거 */

  for(let i=0;i<18;i++){

    const x =
      (Math.random()-.5)*75;

    const z =
      (Math.random()-.5)*75;

    if(
      Math.abs(x)<13 &&
      Math.abs(z)<13
    ) continue;

    createBuilding(
      x,
      z,
      5,
      5,
      9+Math.random()*15,
      "housing"
    );

  }


  /* 상업시설 */

  for(let i=0;i<8;i++){

    createBuilding(
      -18+i*5,
      8,
      3.5,
      3.5,
      5+Math.random()*4,
      "commercial"
    );

  }

}


/* =========================
   선형형
========================= */

function createLinearCity(){

  for(let i=-6;i<=6;i++){

    createRoad(
      0,
      i*9,
      125,
      .9
    );


    createBuilding(
      -18,
      i*9,
      6,
      6,
      9+Math.random()*15,
      "company"
    );


    createBuilding(
      18,
      i*9,
      6,
      6,
      10+Math.random()*16,
      "housing"
    );

  }


  createBuilding(
    0,
    0,
    14,
    11,
    31,
    "public"
  );


  createBuilding(
    0,
    18,
    12,
    10,
    21,
    "university"
  );


  createBuilding(
    0,
    -19,
    12,
    10,
    24,
    "research"
  );

}


/* =========================
   다핵형
========================= */

function createMultiCity(){

  const centers=[
    [-30,-27],
    [30,-27],
    [-30,27],
    [30,27],
    [0,0]
  ];


  centers.forEach(
    (c,index)=>{

      createRoad(
        c[0],
        c[1],
        27,
        1.5
      );

      createRoad(
        c[0],
        c[1],
        1.5,
        27
      );


      let type="company";

      if(index===0)
        type="university";

      if(index===1)
        type="research";

      if(index===2)
        type="housing";

      if(index===3)
        type="commercial";

      if(index===4)
        type="public";


      createBuilding(
        c[0],
        c[1],
        index===4?15:11,
        index===4?13:10,
        index===4?34:18+Math.random()*9,
        type
      );


      for(let i=0;i<4;i++){

        createBuilding(
          c[0]+(Math.random()-.5)*17,
          c[1]+(Math.random()-.5)*17,
          5,
          5,
          7+Math.random()*14,
          "company"
        );

      }

    }
  );

}


/* =========================
   정책 변수
========================= */

function updateValues(){

  values.settlement =
    Number(
      document.getElementById("settlement").value
    );

  values.industry =
    Number(
      document.getElementById("industry").value
    );

  values.talent =
    Number(
      document.getElementById("talent").value
    );

  values.transport =
    Number(
      document.getElementById("transport").value
    );

  values.research =
    Number(
      document.getElementById("research").value
    );


  document.getElementById("vSettlement").textContent=
    values.settlement;

  document.getElementById("vIndustry").textContent=
    values.industry;

  document.getElementById("vTalent").textContent=
    values.talent;

  document.getElementById("vTransport").textContent=
    values.transport;

  document.getElementById("vResearch").textContent=
    values.research;


  /* 공간에도 즉시 반영 */

  updateSpatialDensity();

  updateMetrics();

}


/* =========================
   변수 → 공간 변화
========================= */

function updateSpatialDensity(){

  const industryFactor =
    values.industry/100;

  const settlementFactor =
    values.settlement/100;

  buildings.forEach(
    (b,index)=>{

      const type=
        b.userData.type;


      if(type==="company"){

        const base =
          b.userData.height;

        b.scale.y =
          .65+
          industryFactor*.7;

      }


      if(type==="housing"){

        b.scale.y =
          .75+
          settlementFactor*.55;

      }


      if(type==="research"){

        b.scale.y =
          .75+
          values.research/100*.7;

      }


      if(type==="university"){

        b.scale.y =
          .8+
          values.talent/100*.45;

      }

    }
  );

}


/* =========================
   지표 계산
========================= */

function updateMetrics(){

  const q =
    (
      values.settlement+
      values.industry+
      values.talent+
      values.transport+
      values.research
    )/5;


  const population =
    Math.round(
      40000+
      (q-50)*145
    );


  const firms =
    Math.round(
      120+
      values.industry*2+
      values.research*1.2
    );


  const jobs =
    Math.round(
      8000+
      values.industry*45+
      values.research*35
    );


  const commerce =
    Math.max(
      0,
      Math.min(
        99,
        Math.round(
          (
            values.settlement+
            values.transport+
            values.industry
          )/3
        )
      )
    );


  const exchange =
    Math.round(
      (
        values.transport+
        values.research+
        values.industry
      )/3
    );


  const stability =
    Math.round(
      (
        values.settlement+
        values.talent+
        values.transport
      )/3
    );


  document.getElementById("population")
    .textContent=
    population.toLocaleString();


  document.getElementById("firms")
    .textContent=
    firms.toLocaleString();


  document.getElementById("jobs")
    .textContent=
    jobs.toLocaleString();


  document.getElementById("commerce")
    .textContent=
    commerce+"%";


  document.getElementById("exchange")
    .textContent=
    exchange+"%";


  document.getElementById("stability")
    .textContent=
    stability+"%";

}


/* =========================

========================= */

  }


  if(name==="industry"){

      65,100,70,85,100

  if(name==="living"){

    );

  }


  if(name==="talent"){

    setSliders(
      80,75,100,80,95
    );

  }

}


function setSliders(
  a,b,c,d,e
){

  document.getElementById("settlement").value=a;
  document.getElementById("industry").value=b;
  document.getElementById("talent").value=c;
  document.getElementById("transport").value=d;
  document.getElementById("research").value=e;

  updateValues();

/* =========================
   시간 이동
========================= */

function advance(years){

  currentYear+=years;


  const quality =
    (
      values.settlement+
      values.industry+
      values.talent+
      values.transport+
      values.research
    )/5;


  const growth =
    1+
    ((quality-50)/1000)*years;


  const population =
    Math.round(
      40000*growth
    );


  const firms =
    Math.round(
      120*
      (
        1+
        (
          values.industry+
          values.research-100
        )/300*
        years
      )
    );


  const jobs =
    Math.round(
      8000*
      (
        1+
        (
          values.industry+
          values.research
        )/1000*
        years
      )
    );


  const commerce =
    Math.min(
      99,
      Math.round(
        55+
        (
          values.settlement+
          values.transport+
          values.industry-
          150
        )/5+
        years*.5
      )
    );


  document.getElementById("population")
    .textContent=
    population.toLocaleString();


  document.getElementById("firms")
    .textContent=
    firms.toLocaleString();


  document.getElementById("jobs")
    .textContent=
    jobs.toLocaleString();


  document.getElementById("commerce")
    .textContent=
    commerce+"%";


  document.getElementById("year")
    .textContent=
    "현재 시점 : "+
    currentYear+
    "년";


  growBuildings();

}


/* =========================
   성장 애니메이션
========================= */

function growBuildings(){

  buildings.forEach(
    b=>{

      const finalScale =
        b.scale.y;

      b.scale.y=.08;

      const start =
        performance.now();


      function grow(time){

        const progress =
          Math.min(
            1,
            (time-start)/650
          );


        b.scale.y =
          .08+
          (
            finalScale-.08
          )*
          progress;


        if(progress<1){

          requestAnimationFrame(grow);

        }

      }

      requestAnimationFrame(grow);

    }
  );

}

function setupButtons(){

/* =========================
   터치 카메라
========================= */

let dragging=false;

let lastX=0;
let lastY=0;

let pointers=new Map();

let previousDistance=null;


function setupControls(){

  const canvas =
    renderer.domElement;


  canvas.addEventListener(
    "pointerdown",
    e=>{

      pointers.set(
        e.pointerId,
        e
      );

      canvas.setPointerCapture(
        e.pointerId
      );


      if(pointers.size===1){

        dragging=true;

        lastX=e.clientX;
        lastY=e.clientY;

      }

    }
  );


  canvas.addEventListener(
    "pointermove",
    e=>{

      pointers.set(
        e.pointerId,
        e
      );


      if(pointers.size===1 && dragging){

        const dx=
          e.clientX-lastX;

        const dy=
          e.clientY-lastY;


        city.rotation.y +=
          dx*.006;


        camera.position.y +=
          dy*.035;


        camera.position.y =
          Math.max(
            22,
            Math.min(
              110,
              camera.position.y
            )
          );


        lastX=e.clientX;
        lastY=e.clientY;

      }


      if(pointers.size===2){

        const pts=
          [...pointers.values()];


        const dx=
          pts[0].clientX-
          pts[1].clientX;

        const dy=
          pts[0].clientY-
          pts[1].clientY;


        const distance=
          Math.sqrt(
            dx*dx+
            dy*dy
          );


        if(previousDistance){

          const change =
            previousDistance-distance;


          camera.position.multiplyScalar(
            1+change*.0015
          );

        }


        previousDistance=
          distance;

      }

    }
  );


  canvas.addEventListener(
    "pointerup",
    e=>{

      pointers.delete(
        e.pointerId
      );

      if(pointers.size===0){

        dragging=false;
        previousDistance=null;

      }

    }
  );


  canvas.addEventListener(
    "pointercancel",
    e=>{

      pointers.delete(
        e.pointerId
      );

      if(pointers.size===0){

        dragging=false;
        previousDistance=null;

      }

    }
  );


  canvas.addEventListener(
    "wheel",
    e=>{

      camera.position.multiplyScalar(
        e.deltaY>0?1.08:.92
      );

      camera.position.y=
        Math.max(
          22,
          Math.min(
            120,
            camera.position.y
          )
        );

    }
  );

}


/* =========================
   건물 터치 정보
========================= */

const raycaster =
  new THREE.Raycaster();

const mouse =
  new THREE.Vector2();


function setupClick(){

  renderer.domElement.addEventListener(
    "pointerup",
    e=>{

      if(dragging && pointers.size>0)
        return;


      const rect =
        renderer.domElement.getBoundingClientRect();


      mouse.x =
        (
          (e.clientX-rect.left)/
          rect.width
        )*2-1;


      mouse.y =
        -(
          (e.clientY-rect.top)/
          rect.height
        )*2+1;


      raycaster.setFromCamera(
        mouse,
        camera
      );


      const hits =
        raycaster.intersectObjects(
          buildings
        );


      if(!hits.length)
        return;


      const data=
        hits[0].object.userData;


      const names={
        public:"공공기관",
        university:"지역 대학",
        research:"연구기관",
        company:"연계 기업",
        housing:"주거시설",
        commercial:"상업시설"
      };


      const explanations={
        public:"이전 공공기관의 핵심 거점입니다.",
        university:"지역인재 공급과 산학협력의 거점입니다.",
        research:"공공기관·기업과 연구개발을 연결하는 공간입니다.",
        company:"공공기관 기능과 연계된 산업 클러스터입니다.",
        housing:"직원과 가족의 정착을 위한 주거 공간입니다.",
        commercial:"근로자와 주민의 생활 수요를 담당하는 상업 공간입니다."
      };


      document.getElementById(
        "infoTitle"
      ).textContent=
        names[data.type];


      document.getElementById(
        "infoText"
      ).textContent=
        explanations[data.type];


      document.getElementById(
        "info"
      ).style.display=
        "block";

    }
  );

}

function animate(){

  requestAnimationFrame(

  );


  renderer.render(

}
