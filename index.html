<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CITY TWIN">
<title>PUBLIC CITY TWIN</title>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;
background:#07101c;color:white;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}

#app{width:100%;height:100%;position:relative}

#ui{
position:absolute;z-index:10;left:18px;top:18px;width:390px;
max-height:calc(100vh - 36px);overflow:auto;
background:rgba(7,15,27,.94);backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.12);border-radius:22px;
padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.4)
}

h1{font-size:25px;margin:0 0 5px;font-weight:800}
.sub{font-size:13px;color:#8e9db3;margin-bottom:20px}

.section{margin-top:18px}
.label{font-size:13px;color:#94a5bd;margin-bottom:8px}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{
border:0;border-radius:12px;padding:12px 9px;
background:#152840;color:#e9f0fa;font-weight:700;font-size:13px
}
button:active{transform:scale(.97)}
button.active{background:#367dff;color:white}
button.wide{grid-column:1/3}

.slider{margin:15px 0}
.sliderHead{display:flex;justify-content:space-between;font-size:13px;font-weight:700}
.sliderHead span:last-child{color:#62a0ff;font-size:14px}
input[type=range]{width:100%;accent-color:#3985ff}

.time{display:flex;gap:7px}
.time button{flex:1}

.metrics{
display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px
}
.metric{
background:rgba(255,255,255,.055);border-radius:13px;padding:12px
}
.metric small{display:block;color:#7f91aa;font-size:11px}
.metric b{font-size:21px;margin-top:3px;display:block}

#hint{
position:absolute;z-index:5;bottom:18px;left:50%;transform:translateX(-50%);
background:rgba(5,12,22,.85);padding:11px 18px;border-radius:30px;
font-size:12px;color:#c7d3e5;white-space:nowrap
}

#info{
display:none;position:absolute;z-index:20;right:22px;top:22px;width:310px;
padding:20px;border-radius:18px;background:rgba(7,15,27,.95);
border:1px solid rgba(255,255,255,.15);box-shadow:0 15px 50px #0008
}
#info h2{margin:0 0 8px;font-size:20px}
#info p{color:#aebbd0;font-size:13px;line-height:1.6;margin:0}
#close{float:right;background:#25344b;border-radius:50%;padding:5px 9px}

#legend{
position:absolute;right:20px;bottom:20px;background:#07101ddd;
padding:12px 15px;border-radius:14px;font-size:11px;color:#aebbd0
}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}

@media(max-width:700px){
#ui{width:350px;left:10px;top:10px;max-height:65vh;padding:17px}
#info{right:10px;top:10px;width:270px}
}
</style>
</head>

<body>
<div id="app">

<div id="ui">
<h1>🏙️ PUBLIC CITY TWIN</h1>
<div class="sub">2차 공공기관 이전 · 도시 시뮬레이션</div>

<div class="section">
<div class="label">도시 모델</div>
<div class="grid">
<button class="preset active" data-p="optimal">통합 최적형</button>
<button class="preset" data-p="industry">산업 클러스터</button>
<button class="preset" data-p="living">정주환경 중심</button>
<button class="preset" data-p="talent">지역인재 중심</button>
</div>
</div>

<div class="section">
<div class="label">공간 구조</div>
<div class="grid">
<button class="layout active" data-l="compact">집약형</button>
<button class="layout" data-l="linear">선형형</button>
<button class="layout wide" data-l="multi">다핵형</button>
</div>
</div>

<div class="section">
<div class="label">정책 변수</div>

<div class="slider">
<div class="sliderHead"><span>정주환경</span><span id="vLiving">80</span></div>
<input id="living" type="range" min="0" max="100" value="80">
</div>

<div class="slider">
<div class="sliderHead"><span>산업 클러스터</span><span id="vIndustry">85</span></div>
<input id="industry" type="range" min="0" max="100" value="85">
</div>

<div class="slider">
<div class="sliderHead"><span>지역인재</span><span id="vTalent">70</span></div>
<input id="talent" type="range" min="0" max="100" value="70">
</div>

<div class="slider">
<div class="sliderHead"><span>광역교통망</span><span id="vTransport">80</span></div>
<input id="transport" type="range" min="0" max="100" value="80">
</div>

<div class="slider">
<div class="sliderHead"><span>산학연 연계</span><span id="vResearch">75</span></div>
<input id="research" type="range" min="0" max="100" value="75">
</div>
</div>

<div class="section">
<div class="label">시간 이동</div>
<div class="time">
<button id="year1">+1년</button>
<button id="year5">+5년</button>
<button id="year20" class="active">20년 시뮬레이션</button>
</div>
</div>

<div class="section">
<div class="label">현재 시점 · <span id="year">2026</span>년</div>
<div class="metrics">
<div class="metric"><small>인구</small><b id="population">40,000</b></div>
<div class="metric"><small>기업</small><b id="firms">120</b></div>
<div class="metric"><small>일자리</small><b id="jobs">18,000</b></div>
<div class="metric"><small>상업 공실률</small><b id="vacancy">38%</b></div>
<div class="metric"><small>클러스터 지수</small><b id="cluster">72</b></div>
<div class="metric"><small>정착 안정도</small><b id="settlement">68</b></div>
</div>
</div>
</div>

<div id="info">
<button id="close">×</button>
<h2 id="infoTitle">시설</h2>
<p id="infoText"></p>
</div>

<div id="hint">☝️ 드래그: 도시 회전 · 두 손가락/휠: 확대·축소 · 건물 터치</div>

<div id="legend">
<span class="dot" style="background:#4b8cff"></span>공공기관　
<span class="dot" style="background:#e2a34c"></span>기업　
<span class="dot" style="background:#39b9a0"></span>대학·연구　
<span class="dot" style="background:#8b94a5"></span>주거
</div>

</div>

<script>
/* =========================
   CITY TWIN ENGINE
========================= */

let scene,camera,renderer,city;
let buildings=[];
let roads=[];
let parks=[];
let clock=new THREE.Clock();

let state={
year:2026,
layout:"compact",
living:80,
industry:85,
talent:70,
transport:80,
research:75
};

const $=id=>document.getElementById(id);

function init(){

scene=new THREE.Scene();
scene.background=new THREE.Color(0x07101c);
scene.fog=new THREE.Fog(0x07101c,180,480);

camera=new THREE.PerspectiveCamera(
55,window.innerWidth/window.innerHeight,.1,1000
);
camera.position.set(145,125,155);

renderer=new THREE.WebGLRenderer({
antialias:true,
powerPreference:"high-performance"
});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.getElementById("app").appendChild(renderer.domElement);

city=new THREE.Group();
scene.add(city);

setupLights();
buildCity();
setupControls();
animate();

window.addEventListener("resize",resize);
}

function setupLights(){

const hemi=new THREE.HemisphereLight(0xbfd8ff,0x172234,2.2);
scene.add(hemi);

const sun=new THREE.DirectionalLight(0xffffff,3);
sun.position.set(100,180,80);
sun.castShadow=true;
sun.shadow.mapSize.width=2048;
sun.shadow.mapSize.height=2048;
scene.add(sun);

const fill=new THREE.DirectionalLight(0x6c9dff,1);
fill.position.set(-100,70,-120);
scene.add(fill);
}

function mat(color,rough=.7){
return new THREE.MeshStandardMaterial({
color,
roughness:rough,
metalness:.05
});
}

function box(w,h,d,color){
const m=new THREE.Mesh(
new THREE.BoxGeometry(w,h,d),
mat(color)
);
m.castShadow=true;
m.receiveShadow=true;
return m;
}

/* 땅 */
function buildGround(){

const ground=box(420,2,420,0x182437);
ground.position.y=-1;
city.add(ground);

}

/* 도로 */
function buildRoad(x,z,w,d){

const road=box(w,.5,d,0x303b4d);
road.position.set(x,.25,z);
city.add(road);

roads.push(road);

/* 중앙선 */
if(w>d){
for(let i=-w/2+5;i<w/2;i+=12){
const line=box(5,.55,.35,0x9ba8b8);
line.position.set(x+i,.53,z);
city.add(line);
}
}else{
for(let i=-d/2+5;i<d/2;i+=12){
const line=box(.35,.55,5,0x9ba8b8);
line.position.set(x,.53,z+i);
city.add(line);
}
}
}

/* 공원 */
function buildPark(x,z,w,d){

const p=box(w,.8,d,0x275b4b);
p.position.set(x,.4,z);
p.userData={
title:"도시 녹지·공원",
text:"정주환경을 높이고 보행·생활권의 질을 개선하는 도시 녹지 공간입니다."
};
p.castShadow=true;
city.add(p);
parks.push(p);

const treeCount=Math.max(4,Math.floor((w*d)/100));

for(let i=0;i<treeCount;i++){
const trunk=box(1,4,1,0x63452c);
trunk.position.set(
x+(Math.random()-.5)*(w-4),
2.5,
z+(Math.random()-.5)*(d-4)
);
city.add(trunk);

const crown=new THREE.Mesh(
new THREE.SphereGeometry(3.5,12,10),
mat(0x26734d)
);
crown.position.set(trunk.position.x,6,trunk.position.z);
crown.castShadow=true;
city.add(crown);
}
}

/* 건물 */
function building(x,z,w,h,d,type,name){

let color;

if(type==="public")color=0x397cff;
if(type==="company")color=0xd69a43;
if(type==="research")color=0x39b5a0;
if(type==="housing")color=0x68758a;
if(type==="commercial")color=0x9a6bb5;
if(type==="station")color=0xe6e9ef;

const b=box(w,h,d,color);
b.position.set(x,h/2,z);

b.userData={type,title:name,text:description(type)};

city.add(b);
buildings.push(b);

/* 창문 */
if(type!=="station"){

const windowMat=mat(0xbad7ff,.25);

const cols=Math.max(2,Math.floor(w/3));
const rows=Math.max(2,Math.floor(h/4));

for(let ix=0;ix<cols;ix++){
for(let iy=0;iy<rows;iy++){

const win=box(.55,.75,.12,0xc8e5ff);

win.position.set(
x-w/2+2+ix*(w-4)/Math.max(1,cols-1),
h/2+iy*3-h/2+3,
z-d/2-.08
);

city.add(win);

const win2=win.clone();
win2.position.z=z+d/2+.08;
city.add(win2);
}
}
}

return b;
}

function description(type){

const data={
public:"이전된 공공기관의 핵심 거점입니다. 관련 기업과 연구기관을 주변으로 끌어들이는 앵커 시설로 작동합니다.",
company:"공공기관의 기능과 연계된 민간기업입니다. 산업 클러스터 수준이 높을수록 주변에 더 많이 집적됩니다.",
research:"지역 대학·연구기관입니다. 공공기관 및 기업과의 산학연 협력을 통해 지역 인재와 기술을 공급합니다.",
housing:"공공기관 종사자와 지역 주민을 위한 주거지역입니다. 정주환경 수준에 따라 규모와 밀도가 달라집니다.",
commercial:"상업시설입니다. 인구와 유동인구가 충분할수록 공실이 감소하고 상권이 활성화됩니다.",
station:"광역교통 거점입니다. 공공기관·기업·대학을 연결해 도시 전체의 접근성을 높입니다."
};
return data[type];
}

/* 도시 초기화 */
function clearCity(){

while(city.children.length){
city.remove(city.children[0]);
}

buildings=[];
roads=[];
parks=[];
}

/* 도시 생성 */
function buildCity(){

clearCity();
buildGround();

const L=state.layout;

let roadGap=42;

if(L==="linear")roadGap=48;
if(L==="multi")roadGap=58;

/* 기본 도로망 */
for(let x=-126;x<=126;x+=roadGap)
buildRoad(x,0,5,300);

for(let z=-126;z<=126;z+=roadGap)
buildRoad(0,z,300,5);

/* 광역 교통축 */
if(state.transport>55){
buildRoad(0,0,11,330);
buildRoad(0,0,330,11);
}

/* 역 */
building(
0,-105,25,14,18,"station","광역교통 환승센터"
);

/* 공공기관 핵심지 */
const publicPositions=[
[-22,-22],[22,-22],[-22,22],[22,22],
[-5,-48],[48,-5]
];

publicPositions.forEach((p,i)=>{
building(
p[0],p[1],
13,25+state.industry*.12,13,
"public","공공기관 "+(i+1)
);
});

/* 대학·연구 */
building(-55,35,20,18+state.research*.08,18,
"research","지역대학");

building(55,35,18,23+state.research*.1,18,
"research","산학연 연구센터");

/* 공원 */
buildPark(-55,-55,38,32);
buildPark(55,-55,38,32);
buildPark(0,65,45,25);

/* 주거 + 기업 배치 */
const count=Math.floor(45+state.industry*.45);

for(let i=0;i<count;i++){

let x,z;

if(L==="compact"){
x=(Math.random()-.5)*190;
z=(Math.random()-.5)*190;
}

if(L==="linear"){
x=(Math.random()-.5)*260;
z=(Math.random()-.5)*75;
}

if(L==="multi"){
const centers=[
[-80,-70],[80,-70],[-80,70],[80,70]
];
const c=centers[i%4];
x=c[0]+(Math.random()-.5)*65;
z=c[1]+(Math.random()-.5)*65;
}

const r=Math.random();

if(r<state.industry/140){

const h=12+Math.random()*(
15+state.industry*.35
);

building(
x,z,
7+Math.random()*5,h,7+Math.random()*5,
"company","연계기업"
);

}else{

const h=10+Math.random()*(
10+state.living*.25
);

building(
x,z,
8+Math.random()*6,h,8+Math.random()*6,
"housing","주거단지"
);
}
}

}

/* =========================
   정책 프리셋
========================= */

document.querySelectorAll(".preset").forEach(btn=>{
btn.onclick=()=>{

document.querySelectorAll(".preset")
.forEach(x=>x.classList.remove("active"));

btn.classList.add("active");

const p=btn.dataset.p;

if(p==="optimal"){
setValues(82,88,75,85,82);
}
if(p==="industry"){
setValues(65,98,60,80,90);
}
if(p==="living"){
setValues(98,65,65,78,70);
}
if(p==="talent"){
setValues(72,78,98,82,95);
}

buildCity();
updateMetrics();
};
});

function setValues(l,i,t,tr,r){

state.living=l;
state.industry=i;
state.talent=t;
state.transport=tr;
state.research=r;

$("living").value=l;
$("industry").value=i;
$("talent").value=t;
$("transport").value=tr;
$("research").value=r;

updateLabels();
}

/* 공간 구조 */
document.querySelectorAll(".layout").forEach(btn=>{
btn.onclick=()=>{

document.querySelectorAll(".layout")
.forEach(x=>x.classList.remove("active"));

btn.classList.add("active");

state.layout=btn.dataset.l;
buildCity();
};
});

/* 슬라이더 */
[
["living","living"],
["industry","industry"],
["talent","talent"],
["transport","transport"],
["research","research"]
].forEach(([id,key])=>{

$(id).oninput=e=>{
state[key]=+e.target.value;
updateLabels();
buildCity();
updateMetrics();
};
});

function updateLabels(){

$("vLiving").textContent=state.living;
$("vIndustry").textContent=state.industry;
$("vTalent").textContent=state.talent;
$("vTransport").textContent=state.transport;
$("vResearch").textContent=state.research;
}

/* =========================
   시뮬레이션
========================= */

function simulate(years){

for(let i=0;i<years;i++){

state.year++;

const cluster=
state.industry*.32+
state.research*.25+
state.transport*.18+
state.talent*.15+
state.living*.10;

populationValue+=
900+
state.living*9+
state.talent*5+
cluster*3;

firmValue+=
2+
state.industry*.055+
state.research*.035;

}

buildCity();
updateMetrics();

}

let populationValue=40000;
let firmValue=120;

$("year1").onclick=()=>simulate(1);
$("year5").onclick=()=>simulate(5);
$("year20").onclick=()=>simulate(20);

function updateMetrics(){

const cluster=Math.round(
state.industry*.30+
state.research*.25+
state.transport*.20+
state.talent*.15+
state.living*.10
);

const settlement=Math.round(
state.living*.4+
state.transport*.2+
state.talent*.2+
state.research*.2
);

const jobs=Math.round(
firmValue*150+
state.industry*70
);

const vacancy=Math.max(
5,
Math.round(
45-
state.living*.15-
state.transport*.10-
cluster*.12
)
);

$("year").textContent=state.year;
$("population").textContent=
Math.round(populationValue).toLocaleString();

$("firms").textContent=
Math.round(firmValue).toLocaleString();

$("jobs").textContent=
jobs.toLocaleString();

$("vacancy").textContent=vacancy+"%";
$("cluster").textContent=cluster;
$("settlement").textContent=settlement;
}

/* =========================
   건물 터치
========================= */

const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();

function selectBuilding(x,y){

const rect=renderer.domElement.getBoundingClientRect();

pointer.x=((x-rect.left)/rect.width)*2-1;
pointer.y=-((y-rect.top)/rect.height)*2+1;

raycaster.setFromCamera(pointer,camera);

const hit=raycaster.intersectObjects(buildings,true);

if(hit.length){

let obj=hit[0].object;

while(obj && !obj.userData.title)
obj=obj.parent;

if(obj){

$("infoTitle").textContent=obj.userData.title;
$("infoText").textContent=obj.userData.text;
$("info").style.display="block";
}
}
}

$("close").onclick=()=>{
$("info").style.display="none";
};

/* =========================
   카메라 조작
========================= */

let dragging=false;
let lastX=0,lastY=0;
let rotY=.65;
let rotX=.55;
let distance=210;

function updateCamera(){

const target=new THREE.Vector3(0,25,0);

camera.position.x=
target.x+Math.sin(rotY)*Math.cos(rotX)*distance;

camera.position.y=
target.y+Math.sin(rotX)*distance;

camera.position.z=
target.z+Math.cos(rotY)*Math.cos(rotX)*distance;

camera.lookAt(target);
}

renderer.domElement.addEventListener("pointerdown",e=>{
dragging=true;
lastX=e.clientX;
lastY=e.clientY;
});

renderer.domElement.addEventListener("pointermove",e=>{

if(!dragging)return;

const dx=e.clientX-lastX;
const dy=e.clientY-lastY;

rotY-=dx*.006;
rotX+=dy*.004;

rotX=Math.max(.2,Math.min(1.25,rotX));

lastX=e.clientX;
lastY=e.clientY;

updateCamera();
});

renderer.domElement.addEventListener("pointerup",e=>{
dragging=false;
selectBuilding(e.clientX,e.clientY);
});

renderer.domElement.addEventListener("pointercancel",()=>{
dragging=false;
});

renderer.domElement.addEventListener("wheel",e=>{
distance+=e.deltaY*.12;
distance=Math.max(80,Math.min(350,distance));
updateCamera();
},{passive:true});

/* 핀치 줌 */
let pinchStart=null;

renderer.domElement.addEventListener("touchstart",e=>{
if(e.touches.length===2){
pinchStart=Math.hypot(
e.touches[0].clientX-e.touches[1].clientX,
e.touches[0].clientY-e.touches[1].clientY
);
}
},{passive:true});

renderer.domElement.addEventListener("touchmove",e=>{
if(e.touches.length===2 && pinchStart){

const now=Math.hypot(
e.touches[0].clientX-e.touches[1].clientX,
e.touches[0].clientY-e.touches[1].clientY
);

distance-=((now-pinchStart)*.3);
distance=Math.max(80,Math.min(350,distance));
pinchStart=now;

updateCamera();
}
},{passive:true});

/* =========================
   렌더링
========================= */

function animate(){

requestAnimationFrame(animate);

const t=clock.getElapsedTime();

city.position.y=Math.sin(t*.25)*.08;

renderer.render(scene,camera);
}

function resize(){

camera.aspect=window.innerWidth/window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth,window.innerHeight);
}

init();
updateCamera();
updateLabels();
updateMetrics();
</script>
</body>
</html>
