<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CITY TWIN">

<title>PUBLIC CITY TWIN</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 background:#07101c;
 color:#fff;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

#app{
 width:100vw;
 height:100vh;
 position:relative;
 overflow:hidden
}

#scene{
 position:absolute;
 inset:0
}

canvas{
 display:block;
 width:100%;
 height:100%;
 touch-action:none
}

#panel{
 position:absolute;
 left:18px;
 top:18px;
 bottom:18px;
 width:390px;
 max-width:calc(100vw - 36px);
 padding:22px;
 border:1px solid rgba(255,255,255,.12);
 border-radius:24px;
 background:rgba(7,15,27,.90);
 backdrop-filter:blur(20px);
 overflow-y:auto;
 z-index:10;
 box-shadow:0 20px 70px rgba(0,0,0,.35)
}

.logo{
 font-size:25px;
 font-weight:900;
 letter-spacing:-1px
}

.sub{
 color:#91a0b7;
 font-size:13px;
 margin-top:5px;
 margin-bottom:20px
}

.section{
 margin-top:20px;
 margin-bottom:10px;
 color:#91a0b7;
 font-size:12px;
 font-weight:700;
 letter-spacing:.5px
}

.row{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px;
 margin-bottom:8px
}

button{
 border:0;
 color:#fff;
 background:#18283e;
 padding:11px 10px;
 border-radius:12px;
 font-size:13px;
 font-weight:700;
 cursor:pointer
}

button:active{
 transform:scale(.97)
}

button.active{
 background:#367cff;
 box-shadow:0 5px 18px rgba(54,124,255,.28)
}

label{
 display:block;
 margin:13px 0
}

.labelrow{
 display:flex;
 justify-content:space-between;
 margin-bottom:7px;
 font-size:13px;
 font-weight:700
}

.value{
 color:#74a7ff
}

input[type=range]{
 width:100%;
 accent-color:#4c8dff;
 height:5px
}

.time{
 display:grid;
 grid-template-columns:1fr 1fr 1.5fr;
 gap:7px
}

.stats{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:9px;
 margin-top:12px
}

.stat{
 background:rgba(255,255,255,.06);
 border:1px solid rgba(255,255,255,.06);
 border-radius:15px;
 padding:13px
}

.stat small{
 display:block;
 color:#8b99ad;
 font-size:11px;
 margin-bottom:5px
}

.stat strong{
 font-size:22px
}

#info{
 position:absolute;
 right:20px;
 top:20px;
 width:290px;
 max-width:calc(100vw - 40px);
 padding:18px;
 border-radius:18px;
 background:rgba(7,15,27,.88);
 backdrop-filter:blur(16px);
 border:1px solid rgba(255,255,255,.12);
 z-index:8;
 display:none
}

#info h3{
 margin:0 0 8px
}

#info p{
 color:#aab5c5;
 font-size:13px;
 line-height:1.55;
 margin:5px 0
}

#closeInfo{
 float:right;
 background:#26364d;
 padding:5px 9px
}

#hint{
 position:absolute;
 bottom:18px;
 left:50%;
 transform:translateX(-50%);
 background:rgba(7,15,27,.78);
 padding:9px 16px;
 border-radius:30px;
 color:#b9c5d6;
 font-size:12px;
 z-index:6;
 white-space:nowrap
}

#loading{
 position:absolute;
 inset:0;
 display:flex;
 align-items:center;
 justify-content:center;
 background:#07101c;
 z-index:100;
 font-weight:800;
 font-size:20px
}

@media(max-width:800px){
 #panel{
  width:330px;
  max-height:82vh;
  bottom:auto
 }
 #info{
  top:auto;
  bottom:65px
 }
}

::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{
 background:#31425b;
 border-radius:5px
}
</style>
</head>

<body>

<div id="app">

<div id="loading">🏙️ CITY TWIN 불러오는 중...</div>

<div id="scene"></div>

<div id="panel">

<div class="logo">🏙️ PUBLIC CITY TWIN</div>
<div class="sub">2차 공공기관 이전 · 도시 시뮬레이션</div>

<div class="section">도시 모델</div>

<div class="row">
<button class="preset active" data-preset="optimal">통합 최적형</button>
<button class="preset" data-preset="industry">산업 클러스터</button>
</div>

<div class="row">
<button class="preset" data-preset="living">정주환경 중심</button>
<button class="preset" data-preset="talent">지역인재 중심</button>
</div>

<div class="section">공간 구조</div>

<div class="row">
<button class="layout active" data-layout="compact">집약형</button>
<button class="layout" data-layout="linear">선형형</button>
</div>

<button class="layout" data-layout="multi" style="width:100%">다핵형</button>

<div class="section">정책 변수</div>

<label>
 <div class="labelrow">
  <span>정주환경</span>
  <span class="value" id="settlementVal">75</span>
 </div>
 <input id="settlement" type="range" min="0" max="100" value="75">
</label>

<label>
 <div class="labelrow">
  <span>산업 클러스터</span>
  <span class="value" id="industryVal">80</span>
 </div>
 <input id="industry" type="range" min="0" max="100" value="80">
</label>

<label>
 <div class="labelrow">
  <span>지역인재</span>
  <span class="value" id="talentVal">65</span>
 </div>
 <input id="talent" type="range" min="0" max="100" value="65">
</label>

<label>
 <div class="labelrow">
  <span>광역교통망</span>
  <span class="value" id="transportVal">80</span>
 </div>
 <input id="transport" type="range" min="0" max="100" value="80">
</label>

<label>
 <div class="labelrow">
  <span>산학연 연계</span>
  <span class="value" id="researchVal">75</span>
 </div>
 <input id="research" type="range" min="0" max="100" value="75">
</label>

<div class="section">시간 이동</div>

<div class="time">
<button id="oneYear">+1년</button>
<button id="fiveYear">+5년</button>
<button id="twentyYear" class="active">20년 시뮬레이션</button>
</div>

<div class="section">현재 도시</div>

<div class="stats">

<div class="stat">
<small>현재 시점</small>
<strong id="year">2026</strong>
</div>

<div class="stat">
<small>인구</small>
<strong id="population">40,000</strong>
</div>

<div class="stat">
<small>기업</small>
<strong id="firms">120</strong>
</div>

<div class="stat">
<small>일자리</small>
<strong id="jobs">18,000</strong>
</div>

<div class="stat">
<small>상업 공실률</small>
<strong id="vacancy">35%</strong>
</div>

<div class="stat">
<small>클러스터 지수</small>
<strong id="cluster">78</strong>
</div>

</div>

</div>

<div id="info">
<button id="closeInfo">×</button>
<h3 id="infoTitle">건물</h3>
<p id="infoText"></p>
</div>

<div id="hint">
👆 드래그: 도시 회전 · 두 손가락/휠: 확대·축소 · 건물 터치
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

let scene,camera,renderer;
let cityGroup=new THREE.Group();
let raycaster=new THREE.Raycaster();
let mouse=new THREE.Vector2();

let buildings=[];
let roads=[];
let trees=[];

let rotationX=.78;
let rotationY=.65;
let distance=150;

let dragging=false;
let lastX=0;
let lastY=0;

let year=2026;

let population=40000;
let firms=120;
let jobs=18000;
let vacancy=35;

let params={
 settlement:75,
 industry:80,
 talent:65,
 transport:80,
 research:75
};

let currentLayout="compact";

init();
animate();

function init(){

 scene=new THREE.Scene();

 scene.background=new THREE.Color(0x07101c);

 camera=new THREE.PerspectiveCamera(
  45,
  window.innerWidth/window.innerHeight,
  .1,
  1000
 );

 renderer=new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:"high-performance"
 });

 renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
 renderer.setSize(window.innerWidth,window.innerHeight);

 renderer.shadowMap.enabled=true;
 renderer.shadowMap.type=THREE.PCFSoftShadowMap;

 document.getElementById("scene").appendChild(renderer.domElement);

 const ambient=new THREE.HemisphereLight(
  0xbfd8ff,
  0x172030,
  2
 );

 scene.add(ambient);

 const sun=new THREE.DirectionalLight(0xffffff,2.8);

 sun.position.set(-80,120,60);
 sun.castShadow=true;

 sun.shadow.mapSize.width=2048;
 sun.shadow.mapSize.height=2048;

 scene.add(sun);

 scene.add(cityGroup);

 createGround();
 createCity();

 setupControls();
 setupUI();

 document.getElementById("loading").style.display="none";

 resize();

 window.addEventListener("resize",resize);
}

function createGround(){

 const geo=new THREE.PlaneGeometry(300,300);

 const mat=new THREE.MeshStandardMaterial({
  color:0x293448,
  roughness:1
 });

 const ground=new THREE.Mesh(geo,mat);

 ground.rotation.x=-Math.PI/2;
 ground.receiveShadow=true;

 cityGroup.add(ground);

}

function createCity(){

 clearCity();

 createRoadNetwork();

 createParks();

 createStation();

 createInstitutions();

 createHousing();

 createBusinesses();

 createTrees();

}

function clearCity(){

 while(cityGroup.children.length>1){

  const obj=cityGroup.children[cityGroup.children.length-1];

  cityGroup.remove(obj);

 }

 buildings=[];
 roads=[];
 trees=[];
}

function material(color,rough=.8){

 return new THREE.MeshStandardMaterial({
  color:color,
  roughness:rough,
  metalness:.05
 });

}

function building(x,z,w,d,h,type){

 let color;

 if(type==="public") color=0x3e73b8;
 if(type==="business") color=0x5d6675;
 if(type==="university") color=0x8069ad;
 if(type==="research") color=0x328b87;
 if(type==="housing") color=0x7b8796;
 if(type==="commerce") color=0xc08a54;

 const geo=new THREE.BoxGeometry(w,h,d);

 const mesh=new THREE.Mesh(
  geo,
  material(color,.65)
 );

 mesh.position.set(x,h/2,z);

 mesh.castShadow=true;
 mesh.receiveShadow=true;

 mesh.userData={
  type:type,
  title:getBuildingName(type),
  height:h
 };

 cityGroup.add(mesh);
 buildings.push(mesh);

 addWindows(mesh,w,d,h,type);

 return mesh;
}

function getBuildingName(type){

 const names={
  public:"공공기관 이전청사",
  business:"연관 기업",
  university:"지역 대학",
  research:"연구개발센터",
  housing:"주거단지",
  commerce:"상업시설"
 };

 return names[type];
}

function addWindows(mesh,w,d,h,type){

 const floors=Math.max(2,Math.floor(h/3));

 const windowMat=new THREE.MeshBasicMaterial({
  color:type==="housing"?0xd6e6ff:0xaed2ff
 });

 for(let i=1;i<floors;i++){

  if(i>12) break;

  const count=Math.max(2,Math.floor(w/2.5));

  for(let j=0;j<count;j++){

   const win=new THREE.Mesh(
    new THREE.PlaneGeometry(.65,.8),
    windowMat
   );

   win.position.set(
    -w/2+1+j*(w-2)/(count-1),
    i*2.8,
    d/2+.012
   );

   mesh.add(win);

   const win2=win.clone();

   win2.rotation.y=Math.PI;
   win2.position.z=-d/2-.012;

   mesh.add(win2);
  }
 }
}

function createRoad(x1,z1,x2,z2,width=4){

 const dx=x2-x1;
 const dz=z2-z1;
 const len=Math.sqrt(dx*dx+dz*dz);

 const geo=new THREE.BoxGeometry(len,.12,width);

 const mesh=new THREE.Mesh(
  geo,
  material(0x171f2b)
 );

 mesh.position.set(
  (x1+x2)/2,
  .07,
  (z1+z2)/2
 );

 mesh.rotation.y=-Math.atan2(dz,dx);

 mesh.receiveShadow=true;

 cityGroup.add(mesh);
 roads.push(mesh);

}

function createRoadNetwork(){

 if(currentLayout==="compact"){

  createRoad(-100,0,100,0,5);
  createRoad(0,-100,0,100,5);

  createRoad(-75,-75,75,75,3);
  createRoad(-75,75,75,-75,3);

 }

 if(currentLayout==="linear"){

  createRoad(-120,0,120,0,6);
  createRoad(-100,-40,100,-40,3);
  createRoad(-100,40,100,40,3);

 }

 if(currentLayout==="multi"){

  createRoad(-110,0,110,0,5);
  createRoad(0,-110,0,110,5);

  createRoad(-90,-70,90,-70,3);
  createRoad(-90,70,90,70,3);

 }

}

function createParks(){

 const parkMat=material(0x355d45);

 let parks=[
  [-45,-45,25,25],
  [45,45,28,20],
  [55,-35,18,30],
  [-55,35,22,18]
 ];

 parks.forEach(p=>{

  const mesh=new THREE.Mesh(
   new THREE.BoxGeometry(p[2],.25,p[3]),
   parkMat
  );

  mesh.position.set(p[0],.12,p[1]);
  mesh.receiveShadow=true;

  cityGroup.add(mesh);

 });

}

function createStation(){

 const station=new THREE.Mesh(
  new THREE.BoxGeometry(24,4,10),
  material(0xd4d7dc)
 );

 station.position.set(0,2,-70);
 station.castShadow=true;

 station.userData={
  title:"광역교통 거점역",
  type:"station",
  description:"KTX·SRT 및 광역교통과 연계되는 핵심 교통 거점"
 };

 cityGroup.add(station);
 buildings.push(station);

}

function createInstitutions(){

 if(currentLayout==="compact"){

  building(-18,-8,12,12,24,"public");
  building(18,-8,12,12,30,"public");
  building(0,15,15,12,27,"public");

  building(-30,20,10,10,16,"research");
  building(30,20,10,10,18,"university");

 }

 if(currentLayout==="linear"){

  building(-65,-10,12,12,28,"public");
  building(-30,-10,12,12,24,"public");
  building(10,-10,12,12,32,"public");
  building(45,-10,12,12,27,"public");

  building(75,15,15,12,20,"research");
  building(-75,15,15,12,18,"university");

 }

 if(currentLayout==="multi"){

  building(-45,-30,13,13,28,"public");
  building(45,-30,13,13,30,"public");

  building(-45,30,13,13,24,"public");
  building(45,30,13,13,27,"public");

  building(0,0,18,14,30,"research");
  building(0,55,20,14,20,"university");

 }

}

function createHousing(){

 const density=.5+params.settlement/100;

 for(let i=0;i<28;i++){

  let angle=i/28*Math.PI*2;
  let radius=65+(i%4)*9;

  if(currentLayout==="linear"){

   let x=-100+i*7;
   let z=(i%2===0?25:-25);

   building(
    x,z,
    8,8,
    10+Math.random()*14*density,
    "housing"
   );

  }else{

   let x=Math.cos(angle)*radius;
   let z=Math.sin(angle)*radius;

   building(
    x,z,
    8,8,
    10+Math.random()*18*density,
    "housing"
   );

  }

 }

}

function createBusinesses(){

 const count=Math.floor(20+params.industry*.35);

 for(let i=0;i<count;i++){

  let angle=i/count*Math.PI*2;
  let radius=35+Math.random()*25;

  let x=Math.cos(angle)*radius;
  let z=Math.sin(angle)*radius;

  building(
   x,z,
   6+Math.random()*5,
   6+Math.random()*5,
   7+Math.random()*14*(params.industry/100),
   i%5===0?"commerce":"business"
  );

 }

}

function createTrees(){

 for(let i=0;i<100;i++){

  let x=(Math.random()-.5)*230;
  let z=(Math.random()-.5)*230;

  if(Math.abs(x)<15 && Math.abs(z)<15) continue;

  const trunk=new THREE.Mesh(
   new THREE.CylinderGeometry(.35,.5,2,8),
   material(0x65452d)
  );

  trunk.position.set(x,1,z);

  const crown=new THREE.Mesh(
   new THREE.SphereGeometry(2+Math.random()*1.5,10,8),
   material(0x39734d)
  );

  crown.position.set(x,3,z);

  trunk.castShadow=true;
  crown.castShadow=true;

  cityGroup.add(trunk);
  cityGroup.add(crown);

  trees.push(trunk,crown);

 }

}

function setupControls(){

 const c=renderer.domElement;

 c.addEventListener("pointerdown",e=>{

  dragging=true;
  lastX=e.clientX;
  lastY=e.clientY;

 });

 c.addEventListener("pointermove",e=>{

  if(!dragging)return;

  let dx=e.clientX-lastX;
  let dy=e.clientY-lastY;

  rotationY+=dx*.006;
  rotationX+=dy*.004;

  rotationX=Math.max(.35,Math.min(1.3,rotationX));

  lastX=e.clientX;
  lastY=e.clientY;

 });

 c.addEventListener("pointerup",()=>{
  dragging=false;
 });

 c.addEventListener("pointercancel",()=>{
  dragging=false;
 });

 c.addEventListener("wheel",e=>{

  distance+=e.deltaY*.08;

  distance=Math.max(65,Math.min(240,distance));

 });

 c.addEventListener("pointerup",pickBuilding);

}

function pickBuilding(e){

 if(Math.abs(e.clientX-lastX)>8)return;

 const rect=renderer.domElement.getBoundingClientRect();

 mouse.x=((e.clientX-rect.left)/rect.width)*2-1;
 mouse.y=-((e.clientY-rect.top)/rect.height)*2+1;

 raycaster.setFromCamera(mouse,camera);

 const hits=raycaster.intersectObjects(buildings,true);

 if(!hits.length)return;

 let object=hits[0].object;

 while(object.parent && !object.userData.type){
  object=object.parent;
 }

 if(!object.userData.type)return;

 let title=object.userData.title;

 let desc="";

 if(object.userData.type==="public")
 desc="2차 공공기관 이전의 핵심 앵커 시설. 주변 기업과 인재를 끌어들이는 중심 기능.";

 if(object.userData.type==="business")
 desc="공공기관의 업무 기능과 연계되는 민간기업. 산업 클러스터의 규모를 결정하는 핵심 요소.";

 if(object.userData.type==="research")
 desc="대학·공공기관·기업을 연결하는 연구개발 기능. 산학연 연계 수준에 따라 성장성이 달라짐.";

 if(object.userData.type==="university")
 desc="지역인재 공급과 전문인력 양성을 담당하는 대학·교육 기능.";

 if(object.userData.type==="housing")
 desc="공공기관 종사자와 지역 주민을 위한 주거 기능. 정주환경 수준에 따라 규모와 밀도가 변화.";

 if(object.userData.type==="commerce")
 desc="상업·생활 서비스 시설. 인구와 직장인 수가 증가할수록 활성화됨.";

 if(object.userData.type==="station")
 desc=object.userData.description;

 document.getElementById("infoTitle").textContent=title;
 document.getElementById("infoText").textContent=desc;
 document.getElementById("info").style.display="block";

}

function setupUI(){

 document.querySelectorAll(".preset").forEach(btn=>{

  btn.addEventListener("click",()=>{

   document.querySelectorAll(".preset").forEach(x=>x.classList.remove("active"));
   btn.classList.add("active");

   let p=btn.dataset.preset;

   if(p==="optimal"){
    setParams(78,82,70,82,80);
   }

   if(p==="industry"){
    setParams(65,95,55,75,92);
   }

   if(p==="living"){
    setParams(95,65,60,85,70);
   }

   if(p==="talent"){
    setParams(72,72,95,78,90);
   }

   createCity();

  });

 });

 document.querySelectorAll(".layout").forEach(btn=>{

  btn.addEventListener("click",()=>{

   document.querySelectorAll(".layout").forEach(x=>x.classList.remove("active"));
   btn.classList.add("active");

   currentLayout=btn.dataset.layout;

   createCity();

  });

 });

 const sliders=[
  ["settlement","settlementVal"],
  ["industry","industryVal"],
  ["talent","talentVal"],
  ["transport","transportVal"],
  ["research","researchVal"]
 ];

 sliders.forEach(([id,val])=>{

  document.getElementById(id).addEventListener("input",e=>{

   params[id]=Number(e.target.value);

   document.getElementById(val).textContent=e.target.value;

   createCity();
   updateMetrics();

  });

 });

 document.getElementById("oneYear").onclick=()=>simulate(1);
 document.getElementById("fiveYear").onclick=()=>simulate(5);
 document.getElementById("twentyYear").onclick=()=>simulate(20);

 document.getElementById("closeInfo").onclick=()=>{
  document.getElementById("info").style.display="none";
 };

}

function setParams(a,b,c,d,e){

 params.settlement=a;
 params.industry=b;
 params.talent=c;
 params.transport=d;
 params.research=e;

 const map=[
  ["settlement","settlementVal",a],
  ["industry","industryVal",b],
  ["talent","talentVal",c],
  ["transport","transportVal",d],
  ["research","researchVal",e]
 ];

 map.forEach(x=>{
  document.getElementById(x[0]).value=x[2];
  document.getElementById(x[1]).textContent=x[2];
 });

}

function simulate(years){

 const quality=(
  params.settlement*.22+
  params.industry*.23+
  params.talent*.16+
  params.transport*.18+
  params.research*.21
 );

 const growth=(quality-45)/100;

 for(let i=0;i<years;i++){

  year++;

  population*=1+(growth*.018);

  firms*=1+(growth*.035);

  jobs*=1+(growth*.045);

  vacancy-=growth*.55;

 }

 vacancy=Math.max(5,Math.min(60,vacancy));

 updateMetrics();

 animateGrowth();

}

function updateMetrics(){

 document.getElementById("year").textContent=year;

 document.getElementById("population").textContent=
  Math.round(population).toLocaleString();

 document.getElementById("firms").textContent=
  Math.round(firms).toLocaleString();

 document.getElementById("jobs").textContent=
  Math.round(jobs).toLocaleString();

 document.getElementById("vacancy").textContent=
  vacancy.toFixed(1)+"%";

 const cluster=
  params.industry*.35+
  params.research*.25+
  params.transport*.15+
  params.talent*.15+
  params.settlement*.10;

 document.getElementById("cluster").textContent=
  Math.round(cluster);

}

function animateGrowth(){

 buildings.forEach((b,i)=>{

  if(b.userData.type==="business"){

   b.scale.y*=1.015;

  }

 });

}

function resize(){

 camera.aspect=window.innerWidth/window.innerHeight;
 camera.updateProjectionMatrix();

 renderer.setSize(window.innerWidth,window.innerHeight);

}

function updateCamera(){

 camera.position.x=
  Math.sin(rotationY)*Math.cos(rotationX)*distance;

 camera.position.y=
  Math.sin(rotationX)*distance;

 camera.position.z=
  Math.cos(rotationY)*Math.cos(rotationX)*distance;

 camera.lookAt(0,0,0);

}

function animate(){

 requestAnimationFrame(animate);

 updateCamera();

 renderer.render(scene,camera);

}

</script>
