<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CITY TWIN">

<title>PUBLIC CITY TWIN</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 background:#07101c;
 color:white;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

#app{
 position:fixed;
 inset:0;
}

#city{
 position:absolute;
 inset:0;
}

#panel{
 position:absolute;
 left:18px;
 top:18px;
 width:370px;
 max-height:calc(100vh - 36px);
 overflow:auto;
 padding:22px;
 border-radius:22px;
 background:rgba(7,16,28,.93);
 border:1px solid rgba(255,255,255,.12);
 backdrop-filter:blur(18px);
 box-shadow:0 20px 60px rgba(0,0,0,.4);
 z-index:10;
}

h1{
 margin:0;
 font-size:25px;
 letter-spacing:-1px;
}

.subtitle{
 margin-top:5px;
 color:#93a4bb;
 font-size:13px;
}

.section{
 margin-top:20px;
}

.section-title{
 color:#91a4bd;
 font-size:12px;
 margin-bottom:9px;
 font-weight:700;
}

.grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px;
}

button{
 border:0;
 border-radius:12px;
 padding:12px 10px;
 background:#14263d;
 color:white;
 font-weight:700;
 font-size:13px;
}

button:active{
 transform:scale(.97);
}

button.active{
 background:#347cff;
}

.slider{
 margin:13px 0;
}

.slider-top{
 display:flex;
 justify-content:space-between;
 font-size:13px;
 font-weight:700;
}

.value{
 color:#65a0ff;
}

input[type=range]{
 width:100%;
 margin-top:7px;
 accent-color:#3985ff;
}

.time-buttons{
 display:grid;
 grid-template-columns:1fr 1fr 1.4fr;
 gap:7px;
}

.metrics{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px;
 margin-top:12px;
}

.metric{
 padding:12px;
 border-radius:13px;
 background:#111e31;
}

.metric small{
 display:block;
 color:#8192a9;
 font-size:10px;
}

.metric strong{
 display:block;
 margin-top:4px;
 font-size:19px;
}

#info{
 position:absolute;
 right:22px;
 top:22px;
 width:310px;
 padding:18px;
 border-radius:18px;
 background:rgba(7,16,28,.94);
 border:1px solid rgba(255,255,255,.14);
 backdrop-filter:blur(16px);
 z-index:20;
 display:none;
}

#info h2{
 margin:0 0 7px;
 font-size:18px;
}

#info p{
 margin:5px 0;
 color:#b9c6d8;
 font-size:12px;
 line-height:1.5;
}

#close{
 position:absolute;
 right:10px;
 top:10px;
 width:30px;
 height:30px;
 padding:0;
 border-radius:50%;
}

#legend{
 position:absolute;
 right:22px;
 bottom:22px;
 padding:13px 15px;
 border-radius:15px;
 background:rgba(7,16,28,.88);
 font-size:11px;
 color:#b9c6d8;
 z-index:10;
}

.legend-row{
 display:flex;
 align-items:center;
 gap:7px;
 margin:4px 0;
}

.dot{
 width:9px;
 height:9px;
 border-radius:50%;
}

#hint{
 position:absolute;
 bottom:20px;
 left:50%;
 transform:translateX(-50%);
 padding:10px 16px;
 border-radius:20px;
 background:rgba(7,16,28,.85);
 color:#b9c6d8;
 font-size:11px;
 z-index:5;
 white-space:nowrap;
}

@media(max-width:800px){
 #panel{
  width:340px;
  left:12px;
  top:12px;
  max-height:calc(100vh - 24px);
 }

 #info{
  right:12px;
  top:12px;
  width:280px;
 }

 #legend{
  display:none;
 }
}
</style>
</head>

<body>

<div id="app">

<canvas id="city"></canvas>

<div id="panel">

<h1>🏙️ PUBLIC CITY TWIN</h1>
<div class="subtitle">2차 공공기관 이전 · 도시 시뮬레이션</div>

<div class="section">
<div class="section-title">도시 모델</div>

<div class="grid">
<button class="preset active" data-preset="optimal">통합 최적형</button>
<button class="preset" data-preset="industry">산업 클러스터</button>
<button class="preset" data-preset="living">정주환경 중심</button>
<button class="preset" data-preset="talent">지역인재 중심</button>
</div>
</div>

<div class="section">
<div class="section-title">공간 구조</div>

<div class="grid">
<button class="layout active" data-layout="compact">집약형</button>
<button class="layout" data-layout="linear">선형형</button>
<button class="layout" data-layout="polycentric">다핵형</button>
<button class="layout" data-layout="mixed">혼합형</button>
</div>
</div>

<div class="section">

<div class="section-title">정책 변수</div>

<div class="slider">
<div class="slider-top">
<span>정주환경</span>
<span class="value" id="vLiving">80</span>
</div>
<input id="living" type="range" min="0" max="100" value="80">
</div>

<div class="slider">
<div class="slider-top">
<span>산업 클러스터</span>
<span class="value" id="vIndustry">85</span>
</div>
<input id="industry" type="range" min="0" max="100" value="85">
</div>

<div class="slider">
<div class="slider-top">
<span>지역인재</span>
<span class="value" id="vTalent">70</span>
</div>
<input id="talent" type="range" min="0" max="100" value="70">
</div>

<div class="slider">
<div class="slider-top">
<span>광역교통망</span>
<span class="value" id="vTransport">80</span>
</div>
<input id="transport" type="range" min="0" max="100" value="80">
</div>

<div class="slider">
<div class="slider-top">
<span>산학연 연계</span>
<span class="value" id="vResearch">75</span>
</div>
<input id="research" type="range" min="0" max="100" value="75">
</div>

</div>

<div class="section">

<div class="section-title">시간 이동</div>

<div class="time-buttons">
<button id="year1">+1년</button>
<button id="year5">+5년</button>
<button id="year20" class="active">20년 시뮬레이션</button>
</div>

</div>

<div class="section">

<div class="section-title">도시 현황</div>

<div style="color:#70a5ff;font-size:12px;margin-bottom:5px">
현재 시점 : <b id="year">2026</b>년
</div>

<div class="metrics">

<div class="metric">
<small>인구</small>
<strong id="population">40,000</strong>
</div>

<div class="metric">
<small>기업</small>
<strong id="firms">120</strong>
</div>

<div class="metric">
<small>일자리</small>
<strong id="jobs">21,000</strong>
</div>

<div class="metric">
<small>상업 활성도</small>
<strong id="commerce">64%</strong>
</div>

<div class="metric">
<small>정주 안정성</small>
<strong id="settlement">61%</strong>
</div>

<div class="metric">
<small>산학연 연계</small>
<strong id="network">67%</strong>
</div>

</div>
</div>

</div>

<div id="info">
<button id="close">×</button>
<h2 id="infoTitle">건물</h2>
<div id="infoBody"></div>
</div>

<div id="legend">

<div class="legend-row"><span class="dot" style="background:#397cff"></span>공공기관</div>
<div class="legend-row"><span class="dot" style="background:#e09a4d"></span>기업</div>
<div class="legend-row"><span class="dot" style="background:#49a98d"></span>대학</div>
<div class="legend-row"><span class="dot" style="background:#9c67d7"></span>연구소</div>
<div class="legend-row"><span class="dot" style="background:#687b94"></span>주거</div>
</div>

<div id="hint">👆 드래그: 도시 회전 · 두 손가락/휠: 확대·축소 · 건물 터치</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

const canvas=document.getElementById("city");

const renderer=new THREE.WebGLRenderer({
 canvas,
 antialias:true,
 powerPreference:"high-performance"
});

renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x07101c);

const camera=new THREE.PerspectiveCamera(
45,
innerWidth/innerHeight,
0.1,
1000
);

camera.position.set(95,95,95);

const ambient=new THREE.HemisphereLight(
0x9fb7d9,
0x111827,
2
);

scene.add(ambient);

const sun=new THREE.DirectionalLight(
0xffffff,
3
);

sun.position.set(50,100,40);
sun.castShadow=true;

scene.add(sun);

const cityGroup=new THREE.Group();
scene.add(cityGroup);

const clickable=[];

let layout="compact";
let simYear=2026;

let values={
 living:80,
 industry:85,
 talent:70,
 transport:80,
 research:75
};

const raycaster=new THREE.Raycaster();
const mouse=new THREE.Vector2();

function material(color){

 return new THREE.MeshStandardMaterial({
  color,
  roughness:.72,
  metalness:.08
 });

}

function box(x,y,z,w,h,d,color,type,data){

 const geometry=new THREE.BoxGeometry(w,h,d);

 const mesh=new THREE.Mesh(
  geometry,
  material(color)
 );

 mesh.position.set(x,h/2,z);

 mesh.castShadow=true;
 mesh.receiveShadow=true;

 mesh.userData={
  type,
  ...data
 };

 cityGroup.add(mesh);
 clickable.push(mesh);

 return mesh;

}

function clearCity(){

 while(cityGroup.children.length){

  const obj=cityGroup.children.pop();

  obj.geometry?.dispose();
  obj.material?.dispose();

 }

 clickable.length=0;

}

function road(x,z,w,d){

 const g=new THREE.BoxGeometry(w,.35,d);

 const m=new THREE.Mesh(
  g,
  material(0x273447)
 );

 m.position.set(x,.15,z);

 cityGroup.add(m);

}

function tree(x,z){

 const trunk=box(
  x,0,z,
  .7,3,.7,
  0x594633,
  "tree",
  {}
 );

 const crown=new THREE.Mesh(
  new THREE.SphereGeometry(2.2,10,10),
  material(0x176b4d)
 );

 crown.position.set(x,4,z);
 crown.castShadow=true;

 cityGroup.add(crown);

}

function park(x,z,size=10){

 const g=new THREE.BoxGeometry(size,.3,size);

 const m=new THREE.Mesh(
  g,
  material(0x173f35)
 );

 m.position.set(x,.15,z);

 cityGroup.add(m);

 for(let i=0;i<4;i++){

  tree(
   x+(Math.random()-.5)*size*.7,
   z+(Math.random()-.5)*size*.7
  );

 }

}

function createBuilding(type,x,z,scale=1){

 let color;
 let baseH;
 let width;

 if(type==="public"){
  color=0x397cff;
  baseH=18;
  width=7;
 }

 if(type==="firm"){
  color=0xe09a4d;
  baseH=12;
  width=6;
 }

 if(type==="university"){
  color=0x49a98d;
  baseH=10;
  width=10;
 }

 if(type==="research"){
  color=0x9c67d7;
  baseH=15;
  width=7;
 }

 if(type==="housing"){
  color=0x687b94;
  baseH=16;
  width=6;
 }

 if(type==="commercial"){
  color=0xc66c75;
  baseH=8;
  width=7;
 }

 const height=baseH*scale;

 return box(
  x,0,z,
  width,height,width,
  color,
  type,
  {}
 );

}

function generateCity(){

 clearCity();

 // ground
 const ground=new THREE.Mesh(
  new THREE.BoxGeometry(180,.5,180),
  material(0x303a4b)
 );

 ground.position.y=-.25;
 ground.receiveShadow=true;
 cityGroup.add(ground);

 // main roads
 road(0,0,180,5);
 road(0,0,5,180);

 road(-45,0,180,2.5);
 road(45,0,180,2.5);

 road(0,-45,2.5,180);
 road(0,45,2.5,180);

 // station
 const station=box(
  0,0,-48,
  18,5,8,
  0xdce6f2,
  "station",
  {}
 );

 // parks
 park(-28,-28,18);
 park(28,28,18);
 park(-55,55,14);

 let publicCount=0;
 let firmCount=0;

 const density=.55+(values.industry/100)*.5;
 const livingDensity=.45+(values.living/100)*.65;

 // central public institutions
 const publics=[
  [-18,-10],
  [0,-10],
  [18,-10],
  [-18,10],
  [18,10]
 ];

 publics.forEach((p,i)=>{

  createBuilding(
   "public",
   p[0],
   p[1],
   1+values.industry/150
  );

  publicCount++;

 });

 // university + research
 createBuilding(
  "university",
  -25,-27,
  1+values.talent/180
 );

 createBuilding(
  "research",
  25,-27,
  1+values.research/180
 );

 // layout-dependent businesses
 for(let i=0;i<26;i++){

  let x,z;

  if(layout==="compact"){

   x=(Math.random()-.5)*75;
   z=(Math.random()-.5)*55;

  }

  else if(layout==="linear"){

   x=(Math.random()-.5)*150;
   z=(Math.random()-.5)*18;

  }

  else if(layout==="polycentric"){

   const centers=[
    [-40,-35],
    [40,-35],
    [-40,35],
    [40,35]
   ];

   const c=centers[i%4];

   x=c[0]+(Math.random()-.5)*25;
   z=c[1]+(Math.random()-.5)*25;

  }

  else{

   x=(Math.random()-.5)*110;
   z=(Math.random()-.5)*75;

  }

  const industrial=values.industry/100;

  if(Math.random()<industrial){

   createBuilding(
    "firm",
    x,z,
    .7+Math.random()*.9
   );

   firmCount++;

  }else{

   createBuilding(
    "commercial",
    x,z,
    .6+Math.random()*.7
   );

  }

 }

 // housing
 const housingN=Math.floor(18+values.living*.22);

 for(let i=0;i<housingN;i++){

  let x=(Math.random()-.5)*140;
  let z=(Math.random()-.5)*110;

  createBuilding(
   "housing",
   x,z,
   .6+livingDensity*.8
  );

 }

 // extra trees
 for(let i=0;i<55;i++){

  tree(
   (Math.random()-.5)*160,
   (Math.random()-.5)*150
  );

 }

 updateMetrics();

}

function updateMetrics(){

 const policy=
 (
  values.living+
  values.industry+
  values.talent+
  values.transport+
  values.research
 )/5;

 const growth=(simYear-2026);

 const population=Math.round(
  40000+
  growth*(170+policy*3)
 );

 const firms=Math.round(
  120+
  growth*(1.5+values.industry*.035+values.research*.015)
 );

 const jobs=Math.round(
  21000+
  growth*(220+values.industry*4+values.research*2)
 );

 const commerce=Math.min(
  99,
  Math.round(
   25+
   values.living*.25+
   values.industry*.18+
   values.transport*.2+
   growth*.7
  )
 );

 const settlement=Math.min(
  99,
  Math.round(
   values.living*.45+
   values.transport*.2+
   values.talent*.15+
   growth*.45
  )
 );

 const network=Math.min(
  99,
  Math.round(
   values.research*.45+
   values.talent*.2+
   values.industry*.2+
   values.transport*.1+
   growth*.4
  )
 );

 document.getElementById("year").textContent=simYear;
 document.getElementById("population").textContent=population.toLocaleString();
 document.getElementById("firms").textContent=firms.toLocaleString();
 document.getElementById("jobs").textContent=jobs.toLocaleString();
 document.getElementById("commerce").textContent=commerce+"%";
 document.getElementById("settlement").textContent=settlement+"%";
 document.getElementById("network").textContent=network+"%";

}

function setValues(){

 values.living=+living.value;
 values.industry=+industry.value;
 values.talent=+talent.value;
 values.transport=+transport.value;
 values.research=+research.value;

 vLiving.textContent=values.living;
 vIndustry.textContent=values.industry;
 vTalent.textContent=values.talent;
 vTransport.textContent=values.transport;
 vResearch.textContent=values.research;

 generateCity();

}

[
 ["living","vLiving"],
 ["industry","vIndustry"],
 ["talent","vTalent"],
 ["transport","vTransport"],
 ["research","vResearch"]
].forEach(([id,val])=>{

 document.getElementById(id).addEventListener(
  "input",
  setValues
 );

});

document.querySelectorAll(".layout").forEach(btn=>{

 btn.addEventListener("click",()=>{

  document.querySelectorAll(".layout")
   .forEach(x=>x.classList.remove("active"));

  btn.classList.add("active");

  layout=btn.dataset.layout;

  generateCity();

 });

});

const presets={

 optimal:{
  living:82,
  industry:88,
  talent:75,
  transport:85,
  research:82
 },

 industry:{
  living:62,
  industry:95,
  talent:65,
  transport:78,
  research:90
 },

 living:{
  living:96,
  industry:62,
  talent:70,
  transport:80,
  research:65
 },

 talent:{
  living:78,
  industry:72,
  talent:96,
  transport:76,
  research:88
 }

};

document.querySelectorAll(".preset").forEach(btn=>{

 btn.addEventListener("click",()=>{

  document.querySelectorAll(".preset")
   .forEach(x=>x.classList.remove("active"));

  btn.classList.add("active");

  const p=presets[btn.dataset.preset];

  living.value=p.living;
  industry.value=p.industry;
  talent.value=p.talent;
  transport.value=p.transport;
  research.value=p.research;

  setValues();

 });

});

function advance(years){

 simYear+=years;

 // stronger visual density over time
 generateCity();

}

year1.onclick=()=>advance(1);
year5.onclick=()=>advance(5);

year20.onclick=()=>{

 simYear=2046;

 generateCity();

};

canvas.addEventListener("pointerdown",e=>{

 canvas.setPointerCapture(e.pointerId);

 canvas.dragging=true;

 canvas.lastX=e.clientX;
 canvas.lastY=e.clientY;

});

canvas.addEventListener("pointermove",e=>{

 if(!canvas.dragging)return;

 const dx=e.clientX-canvas.lastX;
 const dy=e.clientY-canvas.lastY;

 cityGroup.rotation.y+=dx*.006;

 camera.position.y=Math.max(
  45,
  Math.min(150,camera.position.y-dy*.25)
 );

 camera.lookAt(0,0,0);

 canvas.lastX=e.clientX;
 canvas.lastY=e.clientY;

});

canvas.addEventListener("pointerup",()=>{

 canvas.dragging=false;

});

canvas.addEventListener("wheel",e=>{

 e.preventDefault();

 const factor=e.deltaY>0?1.08:.92;

 camera.position.multiplyScalar(factor);

 camera.position.y=Math.max(
  35,
  Math.min(180,camera.position.y)
 );

 camera.lookAt(0,0,0);

},{passive:false});

canvas.addEventListener("pointerup",e=>{

 if(Math.abs(e.clientX-canvas.lastX)>8)return;

 const rect=canvas.getBoundingClientRect();

 mouse.x=((e.clientX-rect.left)/rect.width)*2-1;
 mouse.y=-((e.clientY-rect.top)/rect.height)*2+1;

 raycaster.setFromCamera(mouse,camera);

 const hits=raycaster.intersectObjects(
  clickable,
  false
 );

 if(!hits.length)return;

 const data=hits[0].object.userData;

 showInfo(data);

});

function showInfo(data){

 const info=document.getElementById("info");
 const title=document.getElementById("infoTitle");
 const body=document.getElementById("infoBody");

 const names={
  public:"공공기관",
  firm:"연계 기업",
  university:"지역 대학",
  research:"연구기관",
  housing:"주거단지",
  commercial:"상업시설",
  station:"광역교통 거점"
 };

 title.textContent=names[data.type]||"도시 시설";

 let text="";

 if(data.type==="public"){

  text=`
  <p>공공기관 이전 거점</p>
  <p>지역 연계 기능 : ${Math.round(values.industry*.85)}%</p>
  <p>지역인재 활용 : ${Math.round(values.talent*.9)}%</p>
  <p>산학연 연계 : ${Math.round(values.research*.9)}%</p>
  `;

 }

 else if(data.type==="firm"){

  text=`
  <p>공공기관 기능과 연계되는 기업</p>
  <p>산업 클러스터 수준 : ${values.industry}%</p>
  <p>연구기관 접근성 : ${values.research}%</p>
  <p>교통 접근성 : ${values.transport}%</p>
  `;

 }

 else if(data.type==="university"){

  text=`
  <p>지역 인재 공급 거점</p>
  <p>지역인재 정책 : ${values.talent}%</p>
  <p>기업 연계 가능성 : ${Math.round((values.talent+values.industry)/2)}%</p>
  `;

 }

 else if(data.type==="research"){

  text=`
  <p>산학연 공동연구 거점</p>
  <p>연구 연계 수준 : ${values.research}%</p>
  <p>산업 수요 연계 : ${Math.round((values.research+values.industry)/2)}%</p>
  `;

 }

 else if(data.type==="housing"){

  text=`
  <p>공공기관 종사자 및 지역 주민을 위한 주거지</p>
  <p>정주환경 수준 : ${values.living}%</p>
  <p>교통 접근성 : ${values.transport}%</p>
  `;

 }

 else if(data.type==="commercial"){

  text=`
  <p>생활·업무 수요를 담당하는 상업지구</p>
  <p>예상 상권 활성도 : ${Math.round((values.living+values.transport)/2)}%</p>
  `;

 }

 else if(data.type==="station"){

  text=`
  <p>광역교통 및 도시 간 연결 거점</p>
  <p>광역교통망 수준 : ${values.transport}%</p>
  <p>역세권 개발 가능성 : ${Math.round((values.transport+values.living)/2)}%</p>
  `;

 }

 body.innerHTML=text;
 info.style.display="block";

}

close.onclick=()=>{

 document.getElementById("info").style.display="none";

};

function animate(){

 requestAnimationFrame(animate);

 cityGroup.rotation.x=-.08;

 renderer.render(scene,camera);

}

window.addEventListener("resize",()=>{

 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();

 renderer.setSize(innerWidth,innerHeight);

});

generateCity();
camera.lookAt(0,0,0);
animate();

</script>
